# API Gateway Diponegoro Digital Bank (SRS 2.1): satu pintu untuk aplikasi Mobile & Web.
# - Meneruskan /api/** ke backend (modular monolith). Bila nanti dipecah jadi beberapa layanan,
#   cukup tambah upstream & location baru tanpa mengubah aplikasi klien.
# - Rate limiting per IP (NFR-06), lebih ketat untuk login/OTP.
# - CORS untuk aplikasi Web.
# - TLS/HTTPS dipasang di sini atau di load balancer cloud (NFR-06).

worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    client_max_body_size 2m;

    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    upstream backend { server backend:8080; keepalive 16; }

    # Origin Web yang diizinkan (tambahkan domain web saat sudah di-deploy).
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # CORS ditangani gateway; header CORS dari backend disembunyikan agar tidak ganda di peramban.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        location ~ ^/api/v1/auth/(login|register|biometric-login|recovery) {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key" always;
                add_header Access-Control-Max-Age 3600 always;
                return 204;
            }
            limit_req zone=auth burst=5 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header X-Content-Type-Options nosniff always;
            proxy_pass http://backend;
        }

        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key" always;
                add_header Access-Control-Max-Age 3600 always;
                return 204;
            }
            limit_req zone=api burst=40 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Expose-Headers "Content-Disposition" always;
            add_header X-Content-Type-Options nosniff always;
            proxy_pass http://backend;
        }

        # Dokumentasi API untuk tim Web
        location ~ ^/(swagger-ui|v3/api-docs) { proxy_pass http://backend; }

        location = /health { proxy_pass http://backend/actuator/health; }

        location / { return 404; }
    }
}
