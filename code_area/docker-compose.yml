# Diponegoro Digital Bank — menjalankan seluruh backend dengan satu perintah:
#   docker compose up -d --build
# Lalu buka http://localhost/swagger-ui.html  (aplikasi Android: http://<IP-laptop>/)
#
# Rahasia diambil dari file .env (salin dari .env.example). JANGAN commit file .env.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ddb
      POSTGRES_USER: ddb
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
    volumes:
      - ddb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddb -d ddb"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ddb
      DB_USER: ddb
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      DATA_KEY: ${DATA_KEY:?isi DATA_KEY di .env}
      EXPOSE_OTP: ${EXPOSE_OTP:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DDB_CORS_ALLOWED_ORIGINS: ${DDB_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    expose:
      - "8080"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  ddb-data:
