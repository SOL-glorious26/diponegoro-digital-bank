# Diponegoro Digital Bank — konfigurasi backend
# Nilai rahasia diambil dari environment variable; nilai default hanya untuk pengembangan lokal.
spring:
  application:
    name: ddb-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ddb}
    username: ${DB_USER:ddb}
    password: ${DB_PASSWORD:ddb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # skema hanya diubah lewat Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
  forward-headers-strategy: framework   # di belakang API Gateway / reverse proxy HTTPS

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

ddb:
  security:
    # Kunci HMAC untuk JWT (HS256), minimal 32 karakter. WAJIB diganti di server sungguhan.
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-minutes: 15
    refresh-token-days: 7
    # Kunci AES-256 (base64, 32 byte) untuk mengenkripsi nomor kartu & CVV. WAJIB diganti di server.
    data-key: ${DATA_KEY:ZGV2LW9ubHktZGF0YS1rZXktY2hhbmdlLW1lLTMyYnk=}
  cors:
    # Origin aplikasi Web yang boleh memanggil API langsung dari peramban (pisahkan dengan koma).
    # Tambahkan domain Web saat deploy, mis. DDB_CORS_ALLOWED_ORIGINS=https://bank.example.com
    allowed-origins: ${DDB_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  # Simulasi: OTP dikembalikan di respons API karena belum ada SMS/email sungguhan.
  expose-otp: ${EXPOSE_OTP:true}
  seed-demo-data: ${SEED_DEMO_DATA:true}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:ddb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
ddb:
  seed-demo-data: false
  # Hanya untuk test: skenario transfer/riwayat memakai saldo awal Rp5.000.000. Bawaan aplikasi Rp50.000.
  opening-balance: 5000000

---
# Profil cadangan tanpa PostgreSQL: database file H2 di folder ./data (hanya untuk mencoba cepat).
# Jalankan: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/ddb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
